<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Azure Local Trailwright">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="38" ry="38" fill="url(#bgGrad)"/>

  <g opacity="0.08" stroke="white" stroke-width="0.8">
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
  </g>

  <!-- Badge polygon top (family mark) -->
  <g transform="translate(100,32)" filter="url(#shadow)">
    <polygon points="0,-14 14,-5 10,12 0,7 -10,12 -14,-5" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="white">L</text>
  </g>

  <!-- Trailwright glyph: a designed trail with waypoints, ending at the red target -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="46" fill="white"/>
    <circle cx="100" cy="100" r="38" fill="url(#bgGrad)"/>

    <!-- Blueprint grid inside the disc -->
    <g stroke="white" stroke-width="1" opacity="0.18">
      <line x1="64" y1="88" x2="136" y2="88"/>
      <line x1="64" y1="112" x2="136" y2="112"/>
      <line x1="88" y1="64" x2="88" y2="136"/>
      <line x1="112" y1="64" x2="112" y2="136"/>
    </g>

    <!-- Trail -->
    <path d="M78 120 C 88 120, 88 104, 98 104 S 108 90, 118 84" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.95"/>

    <!-- Waypoints -->
    <circle cx="78" cy="120" r="4" fill="white"/>
    <circle cx="98" cy="104" r="3.2" fill="white" opacity="0.9"/>

    <!-- Destination marker -->
    <circle cx="119" cy="83" r="6.5" fill="#E74C3C" stroke="white" stroke-width="2"/>
    <circle cx="119" cy="83" r="2" fill="white"/>

    <circle cx="100" cy="100" r="38" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  </g>

  <text x="100" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="white" letter-spacing="1" opacity="0.95">AZURE LOCAL</text>
  <text x="100" y="186" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#E74C3C" letter-spacing="1.5" opacity="0.95">TRAILWRIGHT</text>
</svg>
