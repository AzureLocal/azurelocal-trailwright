<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Azure Local Trailwright: design an Azure Local deployment, then hand it to automation">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#003A70;stop-opacity:1" />
      <stop offset="60%"  style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A86D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#1A86D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A70;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#001A3A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="640" height="160" rx="12" ry="12" fill="url(#bannerGrad)"/>

  <g opacity="0.06" stroke="white" stroke-width="0.8">
    <line x1="0" y1="40"  x2="640" y2="40"/>
    <line x1="0" y1="80"  x2="640" y2="80"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="320" y1="0" x2="320" y2="160"/>
    <line x1="480" y1="0" x2="480" y2="160"/>
  </g>

  <!-- Icon square -->
  <rect x="16" y="16" width="128" height="128" rx="20" ry="20" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <g transform="translate(80,36)">
    <polygon points="0,-12 12,-4 8,10 0,6 -8,10 -12,-4" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8"/>
    <text x="0" y="2.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="7.5" fill="white">L</text>
  </g>

  <!-- Trail glyph -->
  <g transform="translate(80,90) scale(0.8) translate(-100,-100)">
    <circle cx="100" cy="100" r="46" fill="white"/>
    <circle cx="100" cy="100" r="38" fill="url(#iconGrad)"/>
    <g stroke="white" stroke-width="1" opacity="0.18">
      <line x1="64" y1="88" x2="136" y2="88"/>
      <line x1="64" y1="112" x2="136" y2="112"/>
      <line x1="88" y1="64" x2="88" y2="136"/>
      <line x1="112" y1="64" x2="112" y2="136"/>
    </g>
    <path d="M78 120 C 88 120, 88 104, 98 104 S 108 90, 118 84" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.95"/>
    <circle cx="78" cy="120" r="4" fill="white"/>
    <circle cx="98" cy="104" r="3.2" fill="white" opacity="0.9"/>
    <circle cx="119" cy="83" r="6.5" fill="#E74C3C" stroke="white" stroke-width="2"/>
    <circle cx="119" cy="83" r="2" fill="white"/>
  </g>

  <text x="164" y="64" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="white" letter-spacing="1" opacity="0.98">Azure Local Trailwright</text>
  <text x="165" y="94" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="16" fill="white" letter-spacing="0.5" opacity="0.88">Design an Azure Local deployment, then hand it to automation</text>
  <text x="165" y="120" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="12.5" fill="white" letter-spacing="0.4" opacity="0.7">Guided design · Microsoft Learn rules · ARM, Bicep, Terraform · runs in your browser</text>
</svg>
